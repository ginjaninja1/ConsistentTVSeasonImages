<div id="ctsiPage" class="view flex flex-direction-column ctsi-hide-labels" data-controller="__plugin/ProviderImageHelperJs" data-title="Consistent TV Season Images" data-require="emby-input,emby-button,emby-select">
<style>
#ctsiPage .content{max-width:none}.ctsi-toolbar{display:flex;gap:.7em;align-items:end;flex-wrap:wrap}.ctsi-toolbar label{min-width:12em}.ctsi-work{margin-top:1em}.ctsi-main-head{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--theme-background,#fff);z-index:8;padding:.4em 0}.ctsi-main-head>div{display:flex;align-items:center;gap:.7em}.ctsi-season{margin:1.3em 0 2.7em}.ctsi-lane{display:grid;grid-template-columns:5em auto minmax(340px,1fr);gap:.6em;align-items:center;margin:.75em 0}.ctsi-workspace{display:flex;align-items:flex-start;gap:.35em;overflow-x:auto;padding:.15em}.ctsi-slot-wrap{width:120px;flex:none;text-align:center}.ctsi-slot-label{display:block;font-size:.72em;font-weight:700;margin-bottom:.22em}.ctsi-slot{width:120px;aspect-ratio:2/3;background:#222;border:2px dashed #777;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;box-sizing:border-box;color:#eee}.ctsi-lane.banner .ctsi-slot{width:120px;aspect-ratio:5/1;min-height:28px}.ctsi-column-selected .ctsi-slot{border:3px solid #4caf50;box-shadow:0 0 0 2px #fff}.ctsi-new .ctsi-slot{border-color:#4caf50;color:#4caf50;font-size:.76em;font-weight:700}.ctsi-slot.edge-left:before,.ctsi-slot.edge-right:after{content:"";position:absolute;top:0;bottom:0;width:5px;background:#4caf50;z-index:6}.ctsi-slot.edge-left:before{left:0}.ctsi-slot.edge-right:after{right:0}.ctsi-slot>.ctsi-card{width:100%;height:100%;aspect-ratio:auto}.ctsi-pool{overflow-x:scroll;background:#181818;border:2px solid #555;border-bottom-color:#4caf50;padding:.3em;min-width:0;scrollbar-color:#4caf50 #444;scrollbar-width:auto}.ctsi-pool::-webkit-scrollbar{height:16px}.ctsi-pool::-webkit-scrollbar-track{background:#444}.ctsi-pool::-webkit-scrollbar-thumb{background:#4caf50;border:3px solid #444;border-radius:8px}.ctsi-strip{display:flex;gap:.3em;width:max-content}.ctsi-strip.banner{display:grid;grid-auto-flow:column;grid-template-rows:repeat(2,64px);gap:.25em}.ctsi-card{width:135px;aspect-ratio:2/3;position:relative;background:#111;cursor:grab;overflow:hidden}.ctsi-card.banner{width:300px;aspect-ratio:5/1}.ctsi-card img{width:100%;height:100%;object-fit:contain}.ctsi-meta{position:absolute;inset:auto 0 0;background:rgba(0,0,0,.9);color:#fff!important;padding:.26em;font-size:.72em;text-align:center;font-weight:700;text-shadow:0 1px 2px #000;z-index:3}.ctsi-icon{position:absolute;z-index:5;border:0;border-radius:50%;background:#111e;color:#fff;font-weight:800;cursor:pointer;line-height:1}.ctsi-tick{top:3px;left:3px;width:24px;height:24px;background:#198c2d}.ctsi-remove{top:3px;right:3px;width:24px;height:24px;background:#b00020}.ctsi-now{right:3px;bottom:23px;border-radius:4px;padding:.28em .45em;background:#1976d2;font-size:.7em}.ctsi-card.poster .ctsi-now{bottom:40px}.ctsi-card.image-error:after{content:"Image failed";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:#8b0000;z-index:2}.ctsi-toast{position:fixed;right:2em;bottom:2em;padding:1em;background:#333;color:#fff;z-index:20}@media(max-width:900px){#ctsiPage .ctsi-lane{grid-template-columns:1fr}}
